services:
  db:
    image: postgis/postgis:15-3.3
    container_name: ps162_db
    environment:
      POSTGRES_DB: firedb
      POSTGRES_USER: fireuser
      POSTGRES_PASSWORD: firepass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireuser -d firedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ps162_backend
    environment:
      DATABASE_URL: postgresql://fireuser:firepass@db:5432/firedb
      FIRMS_API_KEY: ${FIRMS_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./ml:/ml
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: ps162_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  frontend_node_modules: